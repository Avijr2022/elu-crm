name: CRM Tests

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'Backend/**'
      - '.github/workflows/crm-tests.yml'
  pull_request:
    paths:
      - 'Backend/**'
      - '.github/workflows/crm-tests.yml'

jobs:
  crm-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: elinkup
          POSTGRES_PASSWORD: elinkup_local
          POSTGRES_DB: elinkup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elinkup -d elinkup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://elinkup:elinkup_local@localhost:5432/elinkup
      JWT_SECRET_KEY: ci-elinkup-test-secret-key-min-32-chars

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Full backend suite: app lifespan bootstraps schema + seeds on TestClient
      # startup, so a fresh Postgres service is sufficient. Covers CRM, SAL, FIN
      # (payment receipts + partial allocation), PF (branding/editions/tenants/
      # subscriptions/organizations), PRJ, and RLS tenant-isolation tests.
      - name: Run backend test suite
        run: python -m pytest -q --tb=short

  flutter-widgets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter analyze
        run: flutter analyze lib test

      - name: Flutter widget tests
        run: flutter test test/widget_test.dart test/navigation_test.dart
